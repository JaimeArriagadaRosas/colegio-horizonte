<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Colegio Horizonte application architecture</title>
  <desc id="desc">Browser request flows through React Router into pages, shared components, static data and SEO, then Vite creates a portable production build deployed to Vercel.</desc>
  <rect width="1200" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="52" font-size="26" font-weight="700" fill="#0f172a">Application architecture</text>
    <text x="60" y="80" font-size="14" fill="#64748b">Single deployable React application with explicit internal boundaries</text>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="60" y="130" width="170" height="76" rx="14"/><rect x="290" y="130" width="190" height="76" rx="14"/>
      <rect x="540" y="105" width="190" height="58" rx="14"/><rect x="540" y="176" width="190" height="58" rx="14"/>
      <rect x="540" y="247" width="190" height="58" rx="14"/><rect x="790" y="130" width="160" height="76" rx="14"/>
      <rect x="1010" y="130" width="130" height="76" rx="14"/>
    </g>
    <g fill="#0f172a" text-anchor="middle">
      <text x="145" y="164" font-size="18" font-weight="700">Browser</text><text x="145" y="186" font-size="13" fill="#64748b">User navigation</text>
      <text x="385" y="164" font-size="18" font-weight="700">React Router</text><text x="385" y="186" font-size="13" fill="#64748b">SPA routing</text>
      <text x="635" y="140" font-size="16" font-weight="700">Pages</text>
      <text x="635" y="211" font-size="16" font-weight="700">Components</text>
      <text x="635" y="282" font-size="16" font-weight="700">Data + SEO</text>
      <text x="870" y="164" font-size="18" font-weight="700">Vite build</text><text x="870" y="186" font-size="13" fill="#64748b">dist/</text>
      <text x="1075" y="164" font-size="18" font-weight="700">Vercel</text><text x="1075" y="186" font-size="13" fill="#64748b">Hosting</text>
    </g>
    <g stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M230 168h50"/><path d="M480 168h42"/><path d="M730 168h42"/><path d="M950 168h42"/>
      <path d="M522 168v-34h18"/><path d="M522 168v37h18"/><path d="M522 168v108h18"/>
    </g>
    <g fill="#38bdf8"><path d="M280 168l-10-6v12z"/><path d="M522 168l-10-6v12z"/><path d="M772 168l-10-6v12z"/><path d="M992 168l-10-6v12z"/></g>
    <rect x="60" y="342" width="1080" height="40" rx="10" fill="#e0f2fe"/>
    <text x="600" y="367" text-anchor="middle" font-size="14" fill="#0c4a6e">Monorepo deferred until a second deployable app or truly shared multi-consumer package exists.</text>
  </g>
</svg>
