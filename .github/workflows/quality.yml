name: Quality

on:
  push:
    branches:
      - main
      - chore/production-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit diagnostics
        run: |
          npm audit --json > npm-audit.json || true
          npm audit || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run lighthouse:ci

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            npm-audit.json
            .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
