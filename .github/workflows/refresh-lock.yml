name: Refresh patched lockfile

on:
  push:
    branches:
      - chore/production-readiness
    paths:
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/production-readiness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched dependencies in lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify high-severity audit
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin HEAD:chore/production-readiness
